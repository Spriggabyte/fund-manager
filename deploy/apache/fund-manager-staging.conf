# Apache 2.4 virtual host for the fund-manager STAGING environment.
#
# Apache equivalent of deploy/nginx/fund-manager-staging.conf — same three
# auth_basic exemptions, same reasoning. Use one or the other, not both.
#
# Required modules:
#   sudo a2enmod proxy proxy_fcgi rewrite headers alias auth_basic authn_file authz_user
#
# Install:
#   sudo cp fund-manager-staging.conf /etc/apache2/sites-available/
#   sudo a2dissite 000-default
#   sudo a2ensite fund-manager-staging
#   sudo apachectl configtest && sudo systemctl reload apache2
#
# Run certbot AFTER this HTTP vhost is live:
#   sudo certbot --apache -d fund-mananger-staging.foord.co.za
# Certbot writes a separate -le-ssl.conf vhost with the listen 443 and
# SSLCertificate lines, and adds a redirect here.
#
# Setup instructions and the reasoning behind the exemptions: docs/staging.md.

<VirtualHost *:80>
    ServerName fund-mananger-staging.foord.co.za

    DocumentRoot /var/www/fund-manager-staging/current/public
    DirectoryIndex index.php

    # Staging must never be indexed.
    Header always set X-Robots-Tag "noindex, nofollow, noarchive"

    # Fund data arrives as xlsx uploads; Apache's default is unlimited, but cap
    # it to match the nginx conf. PHP's own upload_max_filesize / post_max_size
    # apply independently — raise those in php.ini if a batch is rejected.
    LimitRequestBody 33554432

    # PDF renders are queued, but the browser polls the status endpoint and then
    # streams a multi-MB PDF back. Keep the FPM timeout generous. PHP-FPM's
    # request_terminate_timeout and PHP's max_execution_time also apply.
    ProxyTimeout 120

    # --- Hand .php off to PHP-FPM ------------------------------------------
    # Match the installed PHP version's socket (php8.3-fpm here).
    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/var/run/php/php8.3-fpm.sock|fcgi://localhost/"
    </FilesMatch>

    # --- Gate the whole site behind HTTP basic auth -------------------------
    # Create the password file with:
    #   sudo htpasswd -c /etc/apache2/.htpasswd-staging foord
    #
    # AllowOverride All lets Laravel's shipped public/.htaccess do the front
    # controller rewrite, so this file does not have to duplicate it. On a
    # review box the per-request .htaccess read costs nothing that matters.
    <Directory /var/www/fund-manager-staging/current/public>
        Options -Indexes -MultiViews +FollowSymLinks
        AllowOverride All

        # AuthType Basic
        # AuthName "Foord Fund Manager - Staging"
        # AuthUserFile /etc/apache2/.htpasswd-staging
        # Require valid-user

        # Never serve dotfiles out of the document root.
        <FilesMatch "^\.">
            Require all denied
        </FilesMatch>
    </Directory>

    # --- Exemption 1: the PDF render route ---------------------------------
    # The queue worker's headless Chrome fetches this URL over the network to
    # render a fact sheet (PuppeteerPdfService builds a signed URL against
    # APP_URL). With basic auth applied it gets a 401 and EVERY PDF export
    # fails. Turning auth off here is safe: routes/web.php:16 puts the route
    # behind Laravel's `signed` middleware, so an unsigned or expired request
    # is rejected with a 403.
    #
    # `Require all granted` in a <Location> replaces the `Require valid-user`
    # inherited from the <Directory> above rather than merging with it.
    <Location "/internal/">
        AuthType None
        Require all granted
    </Location>

    # --- Exemption 2: the health endpoint ----------------------------------
    # Deployer curls /up after the symlink switch and rolls back if it fails.
    # It carries no credentials, and /up returns nothing sensitive.
    <Location "/up">
        AuthType None
        Require all granted
    </Location>

    # --- Exemption 3: the ACME challenge -----------------------------------
    # Let's Encrypt fetches this path anonymously to prove domain control.
    # Behind basic auth it gets a 401, so certbot cannot issue a certificate
    # and - worse, because it fails silently months later - cannot RENEW one.
    # The --apache plugin injects its own config at issue time, but webroot
    # renewals and manual re-issues rely on this staying open.
    Alias /.well-known/acme-challenge /var/www/html/.well-known/acme-challenge

    <Directory /var/www/html/.well-known/acme-challenge>
        AuthType None
        Require all granted
        Options -Indexes
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/fund-manager-staging-error.log
    CustomLog ${APACHE_LOG_DIR}/fund-manager-staging-access.log combined
</VirtualHost>
