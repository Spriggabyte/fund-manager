# nginx server block for the fund-manager STAGING environment.
#
# Copy to /etc/nginx/sites-available/fund-manager-staging, replace
# staging.example.com and the PHP-FPM socket version, then:
#   sudo ln -s /etc/nginx/sites-available/fund-manager-staging /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Run certbot AFTER the HTTP block below is live:
#   sudo certbot --nginx -d staging.example.com
# Certbot rewrites this file to add the listen 443 / ssl_certificate lines.
#
# Setup instructions and the reasoning behind the two auth_basic exemptions:
# docs/staging.md.

server {
    listen 80;
    listen [::]:80;
    server_name staging.example.com;

    root /var/www/fund-manager-staging/current/public;
    index index.php;

    charset utf-8;

    # Staging must never be indexed.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # Fund data arrives as xlsx uploads; the default 1m is tight for a batch.
    client_max_body_size 32m;

    # PDF renders are queued, but the browser polls the status endpoint and then
    # streams a multi-MB PDF back. Keep the proxy timeouts generous.
    fastcgi_read_timeout 120s;

    # --- Gate the whole site behind HTTP basic auth -------------------------
    # Create the password file with:
    #   sudo htpasswd -c /etc/nginx/.htpasswd-staging foord
    auth_basic           "Foord Fund Manager — Staging";
    auth_basic_user_file /etc/nginx/.htpasswd-staging;

    # --- Exemption 1: the PDF render route ---------------------------------
    # The queue worker's headless Chrome fetches this URL over the network to
    # render a fact sheet (PuppeteerPdfService::buildUrl builds a signed URL
    # against APP_URL). With basic auth applied it gets a 401 and EVERY PDF
    # export fails. Turning auth_basic off here is safe: the route is already
    # protected by Laravel's `signed` middleware, so an unsigned or expired
    # request is rejected with a 403.
    location ^~ /internal/ {
        auth_basic off;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # --- Exemption 2: the health endpoint ----------------------------------
    # Deployer curls /up after the symlink switch and rolls back if it fails.
    # It carries no credentials, and /up returns nothing sensitive.
    location = /up {
        auth_basic off;
        try_files $uri /index.php?$query_string;
    }

    # --- Exemption 3: the ACME challenge -----------------------------------
    # Let's Encrypt fetches this path anonymously to prove domain control.
    # Behind basic auth it gets a 401, so certbot cannot issue a certificate
    # and — worse, because it fails silently months later — cannot RENEW one.
    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        allow all;
        root /var/www/html;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        # Match the installed PHP version (php8.3-fpm here).
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /var/log/nginx/fund-manager-staging-access.log;
    error_log  /var/log/nginx/fund-manager-staging-error.log;
}
