; Supervisor program for the Laravel Horizon queue master.
; Horizon manages its own worker processes, so a single master process is run.
; Copy to /etc/supervisor/conf.d/fund-manager-horizon.conf, adjust the paths and
; user, then:  supervisorctl reread && supervisorctl update
;
; Graceful deploys: `php artisan horizon:terminate` (run by the deploy) tells
; this master to finish in-flight jobs and exit; Supervisor then restarts it on
; the new release. stopwaitsecs must exceed the Horizon supervisor timeout (240).

[program:fund-manager-horizon]
process_name=%(program_name)s
command=php /var/www/fund-manager/current/artisan horizon
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/fund-manager/shared/storage/logs/horizon.log
stopwaitsecs=300
