; Supervisor program for the Laravel Horizon queue master on STAGING.
; Identical to fund-manager-horizon.conf except for the deploy path and the
; program name, so staging and production can coexist on one box if needed.
;
; Copy to /etc/supervisor/conf.d/fund-manager-staging-horizon.conf, adjust the
; paths and user, then:  supervisorctl reread && supervisorctl update
;
; Graceful deploys: `php artisan horizon:terminate` (run by the deploy) tells
; this master to finish in-flight jobs and exit; Supervisor then restarts it on
; the new release. stopwaitsecs must exceed the Horizon supervisor timeout (240).
;
; The renderer shells out to `node`, so this process needs a system-wide Node on
; PATH — an nvm install in a login shell is NOT visible here. See docs/staging.md §2.

[program:fund-manager-staging-horizon]
process_name=%(program_name)s
command=php /var/www/fund-manager-staging/current/artisan horizon
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/fund-manager-staging/shared/storage/logs/horizon.log
stopwaitsecs=300
